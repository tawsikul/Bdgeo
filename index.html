  };
  el.addEventListener('click', async e => {
    if (e.target.closest('[data-add]')) { await addWith(); return; }
    const ed = e.target.closest('[data-edit]'); if (ed) { const r = Store.get(table, ed.dataset.edit), v = await formDialog({ title: 'Edit', fields, values: r, submit: 'Save changes' }); if (v) await busy(null, async () => { await Store.patch(table, r.id, v); toast('Changes saved', 'good'); draw(); }); return; }
    const dl = e.target.closest('[data-del]'); if (dl && await confirmDialog('Delete this for good?', 'Delete', true)) busy(null, async () => { await Store.del(table, dl.dataset.del); toast('Deleted'); draw(); });
  });
  /* open the Add form, optionally with some boxes already filled in */
  async function addWith(pre) {
    const base = { ...(defaults ? defaults() : {}), ...(pre || {}) }, v = await formDialog({ title: addLabel, fields, values: base, submit: 'Add' });
    if (v) await busy(null, async () => { await Store.add(table, { ...base, ...v }); toast('Added', 'good'); draw(); });
  }
  draw(); el.redraw = draw; el.addWith = addWith; return el;
}

/* turn pasted text into questions. One question per block, a blank line between blocks,
   four options starting A) B) C) D), and a star in front of the correct one. */
function parseQuestions(text) {
  const out = [], errors = [];
  String(text).replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach((block, bi) => {
    const qLines = [], options = []; let answer = -1;
    block.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
      const ans = line.match(/^(?:answer|ans|correct)\s*[:\-]?\s*\(?([A-Da-d])\)?\.?$/i);
      if (ans) { answer = 'ABCD'.indexOf(ans[1].toUpperCase()); return; }
      const opt = line.match(/^(\*)?\s*\(?([A-Da-d])[\).:\-]\s*(\*)?\s*(.+?)\s*(\*)?$/);
      if (opt) { if (opt[1] || opt[3] || opt[5]) answer = options.length; options.push(opt[4]); return; }
      if (!options.length) qLines.push(line.replace(/^(?:Q\s*)?\d+\s*[\).:\-]\s*/i, ''));
    });
    const q = qLines.join(' '), n = bi + 1;
    if (!q) errors.push(`Question ${n}: the question text is missing.`);
    else if (options.length !== 4) errors.push(`Question ${n}: found ${options.length} options, it needs exactly 4 (A to D).`);
    else if (answer < 0 || answer > 3) errors.push(`Question ${n}: put a star (*) in front of the correct option.`);
    else out.push({ id: uid('q'), q, options, answer });
  });
  return { questions: out, errors };
}

/* say in plain words what a send did */
function mailSummary(r) {
  if (r.preview) return '';
  if (r.error && !r.sent) return r.error;
  let t = `${plural(r.sent, 'email')} sent`;
  if (r.failed) t += `, ${r.failed} failed`;
  if (r.waiting) t += `, ${r.waiting} still waiting`;
  if (r.limit) t += '. Today\'s sending limit is used up, so send the rest tomorrow from the Emails tab';
  return t + '.';
}

  const ps = Store.participants(), opts = [['all', `All participants (${ps.length})`]];
  ['Junior', 'Secondary', 'Higher secondary'].forEach(c => { const k = ps.filter(p => p.category === c).length; if (k) opts.push(['cat:' + c, `${c} category (${k})`]); });
  DIVISIONS.forEach(d => { const k = ps.filter(p => p.region === d).length; if (k) opts.push(['reg:' + d, `${d} region (${k})`]); });
  ALL_DISTRICTS.forEach(d => { const k = ps.filter(p => p.district === d).length; if (k) opts.push(['dis:' + d, `${d} district (${k})`]); });
  ROUNDS.forEach(r => { const k = ps.filter(p => (p.selected || []).some(x => x.round === r)).length; if (k) opts.push(['sel:' + r, `Selected for the ${r} (${k})`]); });
  return opts;
}
function audience(key) {
  const ps = Store.participants(), v = key.slice(4);
  if (key.startsWith('cat:')) return ps.filter(p => p.category === v);
  if (key.startsWith('reg:')) return ps.filter(p => p.region === v);
  if (key.startsWith('dis:')) return ps.filter(p => p.district === v);
  if (key.startsWith('sel:')) return ps.filter(p => (p.selected || []).some(x => x.round === v));
  return ps;
}
async function emailNoticeDialog(n) {
  const v = await formDialog({ title: 'Email this notice', submit: 'Send the emails', intro: 'Each person gets their own email. The free plan sends up to 300 a day; anything over that waits in the Emails tab for the next day.',
    values: { to: 'all', subject: 'BGeO: ' + n.title, body: n.body },
    fields: [{ key: 'to', label: 'Send to', type: 'select', options: audienceOptions() }, { key: 'subject', label: 'Email subject', required: true }, { key: 'body', label: 'Email text', type: 'textarea', rows: 8, required: true, help: 'Write {name} where the student\'s name should appear.' }] });
  if (!v) return;
  const people = audience(v.to);
  if (!people.length) return toast('Nobody is in that group yet, so nothing was sent.', 'bad');
  if (!(await confirmDialog(`Send this email to ${plural(people.length, 'person', 'people')}?`, 'Send'))) return;
  busy(null, async () => { const k = await Store.queueMail(people, v.subject, v.body); const r = await sendAndTell(); if (r.preview) toast(`${plural(k, 'email')} listed in the Emails tab (preview)`, 'good'); });
}
ADMIN['admin-site'] = main => {
  const s = Store.db.settings, cf = [{ key: 'contactEmail', label: 'Contact email', type: 'email' }, { key: 'contactPhone', label: 'Contact phone', type: 'tel' }, { key: 'facebook', label: 'Facebook page link', type: 'url', placeholder: 'https://' }];
  const top = document.createElement('div'); top.className = 'stack'; top.style.gap = '16px';
  top.innerHTML = `<section class="panel"><h2>Switches</h2>
      <label class="check" for="sw-reg"><input type="checkbox" id="sw-reg"${s.regOpen ? ' checked' : ''}><span>Registration is open</span></label>
      <label class="check" for="sw-card"><input type="checkbox" id="sw-card"${s.cardsOpen ? ' checked' : ''}><span>Students can download their admit card</span></label>
      <label class="check" for="sw-split"><input type="checkbox" id="sw-split"${s.examSplit ? ' checked' : ''}><span>Students in the admit card districts sit the Regional round in person only (the E-Regional exam is closed to them)</span></label>
      <form class="form" id="cd" novalidate style="margin-top:14px"><div class="field"><label for="cd-list">Admit cards are only for these districts</label><input id="cd-list" name="list" value="${esc(Store.cardDistricts().join(', '))}" placeholder="Every district"><small>Write district names with commas between them, for example: Dhaka, Gazipur. Leave it empty to give the card to every district. A student selected for the National round always gets the National card.</small></div>
        <p class="err" role="alert" hidden></p><div><button class="btn btn-ocean btn-sm" type="submit">Save districts</button></div></form></section>
    <section class="panel"><h2>Contact details</h2><form class="form" id="cf" novalidate>${cf.map(f => fieldHtml(f, s[f.key], 'cf')).join('')}<div><button class="btn btn-ocean btn-sm" type="submit">Save contact details</button></div></form></section>`;
  main.appendChild(top);
  $('#sw-reg', top).onchange = e => busy(null, async () => { const on = e.target.checked; await Store.setting('regOpen', on); toast(on ? 'Registration is open' : 'Registration is closed', 'good'); });
  $('#sw-card', top).onchange = e => busy(null, async () => { const on = e.target.checked; await Store.setting('cardsOpen', on); toast(on ? 'Cards can be downloaded' : 'Cards are hidden', 'good'); });
  $('#sw-split', top).onchange = e => busy(null, async () => { const on = e.target.checked; await Store.setting('examSplit', on); toast(on ? 'The online exam is closed to the admit card districts' : 'Every student can take the online exam', 'good'); });
  $('#cd', top).addEventListener('submit', e => {
    e.preventDefault(); const err = $('.err', e.target), names = e.target.elements.list.value.split(/[,\n]/).map(x => x.trim()).filter(Boolean);
    const list = [], bad = []; names.forEach(n => { const hit = ALL_DISTRICTS.find(d => d.toLowerCase() === n.toLowerCase()); if (!hit) bad.push(n); else if (!list.includes(hit)) list.push(hit); });
    if (bad.length) { err.textContent = `"${bad[0]}" is not one of the 64 districts. Check the spelling, for example Chattogram, Cumilla, Jashore, Bogura, Barishal.`; err.hidden = false; Sound.play('bad'); return; }
    err.hidden = true; busy($('button', e.target), async () => { await Store.setting('cardDistricts', list); e.target.elements.list.value = list.join(', '); toast(list.length ? `Admit cards are for ${plural(list.length, 'district')}` : 'Admit cards are for every district', 'good'); });
  });
  $('#cf', top).addEventListener('submit', e => { e.preventDefault(); const v = readForm(e.target, cf); busy($('button', e.target), async () => { for (const [k, val] of Object.entries(v)) await Store.setting(k, val); toast('Contact details saved', 'good'); }); });
  main.appendChild(crudPanel({ table: 'team', title: 'Team and partners', addLabel: 'Add a person or partner',
    fields: [{ key: 'name', label: 'Name', required: true }, { key: 'role', label: 'Role', required: true, placeholder: 'For example: Convener' }, { key: 'group', label: 'Section', type: 'select', options: TEAM_GROUPS }],
    defaults: () => ({ group: TEAM_GROUPS[0] }), row: t => `<h3>${esc(t.name)} ${sampleChip(t)}</h3><p>${esc(t.role)}, ${esc(t.group)}</p>` }));
  main.appendChild(crudPanel({ table: 'faq', title: 'Questions and answers', addLabel: 'Add a question',
    fields: [{ key: 'q', label: 'Question', required: true }, { key: 'a', label: 'Answer', type: 'textarea', rows: 4, required: true }], row: q => `<h3>${esc(q.q)}</h3><p>${esc(q.a)}</p>` }));
  const reset = document.createElement('section'); reset.className = 'panel';
  reset.innerHTML = '<h2>Preview data</h2><p class="muted">Bring back the original sample data and remove every change made in this browser.</p><div><button type="button" class="btn btn-danger btn-sm">Reset the sample data</button></div>';
  $('button', reset).onclick = async () => { if (await confirmDialog('Reset everything to the original sample data? You will be logged out.', 'Reset', true)) { Store.reset(); toast('Sample data restored'); go('home'); } };
  if (!CLOUD) main.appendChild(reset);
};

/* ---------- start ---------- */
async function boot() {
  buildShell();
  const intro = siteIntro();
  if (WANT_CLOUD && !CLOUD) { if (intro) intro.cancel(); $('#view').innerHTML = '<div class="wrap narrow"><header class="pagehead"><h1>The site could not start</h1><p>A file it needs did not load. Check your internet connection and reload the page.</p></header></div>'; return; }
  $('#view').innerHTML = '<div class="wrap"><header class="pagehead"><p>Loading…</p></header></div>';
  try { await Store.init(); }
  catch (e) { if (intro) intro.cancel(); $('#view').innerHTML = `<div class="wrap narrow"><header class="pagehead"><h1>Could not load the olympiad data</h1><p>${esc(e.message)}</p></header><p><a class="btn btn-lime" href="">Try again</a></p></div>`; return; }
  Store.onRecovery = recoveryDialog;
  /* moving between pages: a tsunami crosses the screen and the page changes underneath it.
     Inside the admin portal and between dashboard tabs the change is instant, since those are places to work in. */
  let drawn = false, lastRoute = routeName(), swapT = 0;
  const isAdminRoute = n => n === 'admin' || n.startsWith('admin-');
  window.addEventListener('hashchange', () => {
    drawn = true; if (intro) intro.cancel();
    const to = routeName(), from = lastRoute; lastRoute = to; clearTimeout(swapT);
    const inDash = n => isDashRoute(n) && !!Store.me();
    if (reducedMotion() || isAdminRoute(to) || (inDash(to) && inDash(from))) { Sound.play('tap'); render(); return; }
    Sound.play('wave'); pageWave(); swapT = setTimeout(render, WAVE_SWAP);
  });
  /* the logo, the headline and the globe cannot be copied or saved with a long press or a right click */
  document.addEventListener('contextmenu', e => { if (e.target.closest('.brand, .hero-title, .foot img, .stage, .intro, .aintro, .dash-top .brand')) e.preventDefault(); });
  document.addEventListener('dragstart', e => { if (e.target.closest('.brand, .foot, .hero-title')) e.preventDefault(); });
  /* the first tap anywhere switches sound on (browsers only allow audio after a tap) */
  document.addEventListener('click', e => {
    Sound.unlock();
    if (e.target.closest('a.btn, button.btn, .iconbtn, .menu a, .bar-links a, .brand, .door, .nextup, .adm-tabs a, .foot a, summary, .mini')) Sound.play('tap');
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  /* the compass button: its needle turns as you scroll, and a tap takes you back north (to the top) */
  const north = $('#north'); let queued = false;
  window.addEventListener('scroll', () => {
    if (queued) return; queued = true;
    requestAnimationFrame(() => { queued = false; const y = window.scrollY || 0; north.hidden = y < 500 || document.body.classList.contains('is-admin'); north.style.setProperty('--turn', ((y * 0.3) % 360) + 'deg'); });
  }, { passive: true });
  north.addEventListener('click', () => window.scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' }));
  /* the page is drawn underneath the opening animation, which then brings the Earth down to its place on it */
  if (!drawn) { render(); if (intro) intro.land(); }
  if (Store.recovery) recoveryDialog();
}
boot();

});
